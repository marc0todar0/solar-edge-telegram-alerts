services:
  telegram-bot:
    build: .
    image: solar-edge-tg-bot
    container_name: solar-edge-tg-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./data:/app/data
    logging:
      options:
        max-size: "5m"
        max-file: "3"
